<mat-form-field>
  <ng-container matPrefix>
    <button class="gui-color-block" type="button" (click)="openColorPicker($event)">
      <span
        class="gui-color-block-bg"
        [style.background]="value + ' center / contain no-repeat'"
      ></span>
    </button>
  </ng-container>

  <input
    matInput
    [(ngModel)]="value"
    [disabled]="disabled"
    [placeholder]="config.placeholder || ''"
    [mtxColorpicker]="cp"
    (colorChange)="onValueChange()"
  />

  <mtx-colorpicker #cp [content]="customPickerContent" />

  @if (value) {
    <gui-icon-button-wrapper matSuffix>
      <button
        mat-icon-button
        type="button"
        color="warn"
        [disabled]="disabled"
        (click)="clearValue()"
        tabindex="-1"
      >
        <mat-icon svgIcon="clear" />
      </button>
    </gui-icon-button-wrapper>
  }

  @if (config.parentType === 'inline') {
    <mat-hint>
      <gui-field-label [config]="config" />
    </mat-hint>
  }
</mat-form-field>

<ng-template #customPickerContent>
  <gui-fill-picker [type]="type" [(ngModel)]="value" (valueChangeComplete)="cp.select($event)" />
</ng-template>
