<mat-form-field>
  @if (config.prefix) {
    <span matTextPrefix>{{ config.prefix }}</span>
  }
  <input
    matInput
    type="text"
    [(ngModel)]="value"
    [disabled]="disabled"
    [placeholder]="config.placeholder || ''"
    (change)="onValueChange()"
  />
  @if (config.suffix) {
    <span matTextSuffix>{{ config.suffix }}</span>
  }
  @if (config.parentType === 'inline') {
    <mat-hint>
      <gui-field-label [config]="config" />
    </mat-hint>
  }
</mat-form-field>
